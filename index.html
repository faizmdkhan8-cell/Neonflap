<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Flap</title>
<style>
  :root {
    --bg-deep: #0a0e17;
    --bg-mid: #10182a;
    --cyan: #00e5ff;
    --magenta: #ff2d78;
    --cream: #eef2f6;
    --amber: #ffb84d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    max-width: 100vw;
    max-height: 100vh;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  #score {
    font-size: 48px;
    font-weight: 700;
    color: var(--cream);
    text-shadow: 0 0 12px rgba(0,229,255,0.6);
    letter-spacing: 1px;
  }
  #best {
    font-size: 14px;
    color: var(--cyan);
    margin-top: 2px;
    opacity: 0.8;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    background: rgba(10,14,23,0.55);
    backdrop-filter: blur(2px);
  }
  #overlay h1 {
    font-size: 40px;
    color: var(--cream);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,45,120,0.5);
  }
  #overlay p {
    color: rgba(238,242,246,0.7);
    font-size: 15px;
    margin-bottom: 22px;
    max-width: 260px;
    line-height: 1.5;
  }
  #playBtn {
    padding: 14px 38px;
    font-size: 17px;
    font-weight: 600;
    color: var(--bg-deep);
    background: linear-gradient(90deg, var(--cyan), #5cf6ff);
    border: none;
    border-radius: 30px;
    box-shadow: 0 0 24px rgba(0,229,255,0.45);
    cursor: pointer;
  }
  #playBtn:active { transform: scale(0.96); }
  #deathScore {
    font-size: 15px;
    color: var(--magenta);
    margin-top: 16px;
    font-weight: 600;
  }
  #adslot {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(238,242,246,0.35);
    letter-spacing: 0.5px;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="score">0</div>
    <div id="best">BEST 0</div>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>NEON FLAP</h1>
    <p>Tap or press Space to flap.<br>Slip through the gates. Don't touch the edges.</p>
    <button id="playBtn">PLAY</button>
    <div id="deathScore"></div>
  </div>
  <div id="adslot"><!-- AD_SLOT: insert 320x50 banner unit here (AdSense / AdMob) --></div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const deathScoreEl = document.getElementById('deathScore');
  const overlayTitle = overlay.querySelector('h1');
  const overlayP = overlay.querySelector('p');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.min(window.innerWidth, 480);
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 1600;
  const FLAP_V = -420;
  const GATE_GAP = 190;
  const GATE_W = 62;
  const GATE_SPACING = 260;
  const SCROLL_SPEED = 190;
  const BIRD_R = 14;

  let bird, gates, score, best = 0, running = false, distSinceGate = 0, particles;

  function resetGame() {
    bird = { x: W * 0.32, y: H * 0.42, vy: 0, rot: 0 };
    gates = [];
    particles = [];
    score = 0;
    distSinceGate = 0;
    for (let i = 0; i < 3; i++) spawnGate(W + i * GATE_SPACING);
    scoreEl.textContent = '0';
  }

  function spawnGate(x) {
    const margin = 70;
    const centerY = margin + Math.random() * (H - margin * 2);
    gates.push({ x, y: centerY, passed: false });
  }

  function flap() {
    if (!running) return;
    bird.vy = FLAP_V;
  }

  function startGame() {
    resetGame();
    running = true;
    overlay.style.display = 'none';
  }

  function endGame() {
    running = false;
    if (score > best) best = score;
    bestEl.textContent = 'BEST ' + best;
    overlayTitle.textContent = 'GAME OVER';
    overlayP.style.display = 'none';
    deathScoreEl.textContent = 'Score: ' + score;
    playBtn.textContent = 'PLAY AGAIN';
    overlay.style.display = 'flex';
    for (let i = 0; i < 18; i++) {
      particles.push({
        x: bird.x, y: bird.y,
        vx: (Math.random() - 0.5) * 300,
        vy: (Math.random() - 0.5) * 300,
        life: 1
      });
    }
  }

  function update(dt) {
    if (running) {
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 500));

      if (bird.y - BIRD_R < 0 || bird.y + BIRD_R > H) {
        endGame();
      }

      for (const g of gates) {
        g.x -= SCROLL_SPEED * dt;
        if (!g.passed && g.x + GATE_W / 2 < bird.x) {
          g.passed = true;
          score++;
          scoreEl.textContent = score;
        }
        const withinX = bird.x + BIRD_R > g.x - GATE_W / 2 && bird.x - BIRD_R < g.x + GATE_W / 2;
        if (withinX) {
          const topEdge = g.y - GATE_GAP / 2;
          const botEdge = g.y + GATE_GAP / 2;
          if (bird.y - BIRD_R < topEdge || bird.y + BIRD_R > botEdge) {
            endGame();
          }
        }
      }

      while (gates.length && gates[0].x < -GATE_W) {
        gates.shift();
        spawnGate(gates[gates.length - 1].x + GATE_SPACING);
      }
    }

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.life -= dt * 1.2;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function drawGrid(t) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,229,255,0.06)';
    ctx.lineWidth = 1;
    const off = (t * 30) % 40;
    for (let x = -off; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.restore();
  }

  function drawGate(g) {
    const topEdge = g.y - GATE_GAP / 2;
    const botEdge = g.y + GATE_GAP / 2;
    ctx.save();
    const grad = ctx.createLinearGradient(g.x - GATE_W/2, 0, g.x + GATE_W/2, 0);
    grad.addColorStop(0, '#ff2d78');
    grad.addColorStop(1, '#c91f5e');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(255,45,120,0.5)';
    ctx.shadowBlur = 14;
    ctx.fillRect(g.x - GATE_W/2, 0, GATE_W, topEdge);
    ctx.fillRect(g.x - GATE_W/2, botEdge, GATE_W, H - botEdge);
    ctx.restore();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, BIRD_R);
    grad.addColorStop(0, '#5cf6ff');
    grad.addColorStop(1, '#00b8cc');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(0,229,255,0.8)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#ff2d78';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    update(dt);

    ctx.clearRect(0, 0, W, H);
    drawGrid(now / 1000);
    for (const g of gates) drawGate(g);
    if (running || particles.length) drawBird();
    drawParticles();

    requestAnimationFrame(frame);
  }

  resetGame();
  requestAnimationFrame(frame);

  playBtn.addEventListener('click', () => {
    overlayP.style.display = 'block';
    overlayTitle.textContent = 'NEON FLAP';
    startGame();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
  });
  canvas.addEventListener('pointerdown', flap);
})();
</script>
</body>
</html>
